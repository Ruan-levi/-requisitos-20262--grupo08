name: Publicar protótipo (GitHub Pages)

on:
  push:
    branches:
      - main
    paths:
      - 'prototipo/**'
      - '.github/workflows/publicar-prototipo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar somente a pasta do protótipo
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./prototipo

      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
