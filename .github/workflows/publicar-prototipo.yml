name: Publicar protótipo (GitHub Pages)

on:
  push:
    branches:
      - main
    paths:
      - 'prototipo/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Preparar Node.js para validação
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar catálogo, rotas e fontes
        run: node --test prototipo/tests/*.test.cjs

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar somente a pasta do protótipo
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./prototipo

      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
