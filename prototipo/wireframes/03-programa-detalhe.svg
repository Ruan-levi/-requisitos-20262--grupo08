<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">Detalhes de intercâmbio</title><desc id="desc">Wireframe editável de baixa fidelidade do Portal de Internacionalização, RF04, RF05, RF08. Estrutura esquemática sem representação de serviço oficial.</desc><rect width="1440" height="900" fill="#f2f5f9"/><rect x="0" y="0" width="1440" height="80" rx="0" fill="#113e75" stroke="#113e75" stroke-width="1"/><text x="54" y="48" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="800" fill="#fff">◉ internacionaliza.</text><text x="676" y="45" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#e3edfb">Programas   Universidades   Documentos   Orientações   Contatos</text><rect x="25" y="115" width="228" height="722" rx="12" fill="#fff" stroke="#d5dfe9" stroke-width="1"/><text x="48" y="158" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#315b82">CENTRAL DE SERVIÇOS</text><text x="50" y="215" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#47627d">Painel</text><rect x="36" y="240" width="206" height="45" rx="8" fill="#e1eafa" stroke="#c9daf0" stroke-width="1"/><text x="50" y="270" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#47627d">Programas</text><text x="50" y="325" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#47627d">Universidades</text><text x="50" y="380" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#47627d">Documentos</text><text x="50" y="435" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#47627d">Notícias</text><text x="50" y="490" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#47627d">Docentes</text><text x="50" y="545" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#47627d">Internacionais</text><text x="50" y="600" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#47627d">Orientações</text><text x="50" y="655" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#47627d">Minha jornada</text><text x="50" y="710" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#47627d">Contatos</text><text x="292" y="224" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#14385b">Intercâmbio acadêmico</text><line x1="292" y1="240" x2="1376" y2="240" stroke="#dce4ee" stroke-width="2"/><text x="292" y="278" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" fill="#30465e">Entenda como planejar a mobilidade e confirmar os critérios oficiais.</text><rect x="292" y="311" width="687" height="426" rx="12" fill="#fff" stroke="#d5dfe9" stroke-width="1"/><text x="312" y="347" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#30465e">Como funciona</text><text x="312" y="390" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#65788e">O estudante cursa atividades acadêmicas no exterior,</text><text x="312" y="417" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#65788e">conforme edital, convênio e validação da coordenação.</text><text x="312" y="483" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#30465e">O que verificar antes</text><text x="317" y="521" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#65788e">✓ Edital e período da seleção</text><text x="317" y="559" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#65788e">✓ Compatibilidade de curso e disciplinas</text><text x="317" y="597" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#65788e">✓ Idioma, custos e documentação</text><text x="317" y="635" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#65788e">✓ Apoio e contato institucional</text><rect x="1002" y="311" width="375" height="278" rx="12" fill="#fff" stroke="#d5dfe9" stroke-width="1"/><text x="1024" y="354" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#30465e">Fontes e próximos passos</text><rect x="1024" y="381" width="314" height="40" rx="9" fill="#1a589e" stroke="#1a589e" stroke-width="1"/><text x="1040" y="407" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#fff">Abrir fonte oficial ↗</text><rect x="1024" y="433" width="314" height="40" rx="9" fill="#eef4fc" stroke="#d1dfec" stroke-width="1"/><text x="1040" y="459" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#27568b">Documentos →</text><rect x="1024" y="484" width="314" height="40" rx="9" fill="#eef4fc" stroke="#d1dfec" stroke-width="1"/><text x="1040" y="510" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#27568b">Universidades →</text><rect x="1002" y="609" width="375" height="130" rx="12" fill="#fff" stroke="#d5dfe9" stroke-width="1"/><text x="1024" y="644" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#30465e">Perguntas frequentes</text><text x="1024" y="679" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#30465e">▸ Existe vaga garantida?</text><text x="1024" y="714" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#30465e">▸ Quais documentos preciso?</text><text x="301" y="859" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#74869a">TELA 03  •  RF04, RF05, RF08  •  wireframe de baixa fidelidade</text></svg>