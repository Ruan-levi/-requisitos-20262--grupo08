os e FAQ</text><text x="847" y="713" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#65788e">Procure o canal institucional</text><text x="847" y="765" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#145a9b">Abrir →</text><text x="301" y="859" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#74869a">TELA 01  •  RF01, RF02, RF03  •  wireframe de baixa fidelidade</text></svg>