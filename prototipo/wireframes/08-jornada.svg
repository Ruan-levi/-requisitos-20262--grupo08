<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">Minha jornada internacional</title><desc id="desc">Wireframe editável de baixa fidelidade do Portal de Internacionalização, RF04, RF05, RF06. Estrutura esquemática sem representação de serviço oficial.</desc><rect width="1440" height="900" fill="#f2f5f9"/><rect x="0" y="0" width="1440" height="80" rx="0" fill="#113e75" stroke="#113e75" stroke-width="1"/><text x="54" y="48" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="800" fill="#fff">◉ internacionaliza.</text><text x="676" y="45" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#e3edfb">Programas   Universidades   Documentos   Orientações   Contatos</text><rect x="25" y="115" width="228" height="722" rx="12" fill="#fff" stroke="#d5dfe9" stroke-width="1"/><text x="48" y="158" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#315b82">CENTRAL DE SERVIÇOS</text><text x="50" y="215" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#47627d">Painel</text><text x="50" y="270" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#47627d">Programas</text><text x="50" y="325" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#47627d">Universidades</text><text x="50" y="380" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#47627d">Documentos</text><text x="50" y="435" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#47627d">Notícias</text><text x="50" y="490" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#47627d">Docentes</text><text x="50" y="545" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#47627d">Internacionais</text><text x="50" y="600" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#47627d">Orientações</text><rect x="36" y="625" width="206" height="45" rx="8" fill="#e1eafa" stroke="#c9daf0" stroke-width="1"/><text x="50" y="655" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#47627d">Minha jornada</text><text x="50" y="710" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#47627d">Contatos</text><text x="292" y="224" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#14385b">Minha jornada internacional</text><line x1="292" y1="240" x2="1376" y2="240" stroke="#dce4ee" stroke-width="2"/><text x="292" y="280" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" fill="#30465e">Selecione seu interesse para receber um roteiro de consulta.</text><text x="292" y="335" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#48627d">Modalidade</text><rect x="292" y="344" width="335" height="46" rx="8" fill="#fbfcfe" stroke="#cbd6e5" stroke-width="1"/><text x="306" y="373" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#8697a7">Intercâmbio acadêmico ▾</text><text x="654" y="335" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#48627d">Área acadêmica</text><rect x="654" y="344" width="335" height="46" rx="8" fill="#fbfcfe" stroke="#cbd6e5" stroke-width="1"/><text x="668" y="373" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#8697a7">Engenharia / Tecnologia ▾</text><text x="1013" y="335" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#48627d">País de interesse</text><rect x="1013" y="344" width="363" height="46" rx="8" fill="#fbfcfe" stroke="#cbd6e5" stroke-width="1"/><text x="1027" y="373" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#8697a7">Portugal ▾</text><rect x="292" y="420" width="270" height="40" rx="9" fill="#1a589e" stroke="#1a589e" stroke-width="1"/><text x="308" y="446" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#fff">Montar meu roteiro</text><rect x="292" y="493" width="1085" height="266" rx="12" fill="#fff" stroke="#d5dfe9" stroke-width="1"/><text x="316" y="536" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#30465e">Roteiro de consulta sugerido</text><text x="320" y="582" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#65788e">1. Conheça o programa e os requisitos da seleção.</text><text x="320" y="624" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#65788e">2. Confira instituições e documentos históricos do seu curso.</text><text x="320" y="666" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#65788e">3. Organize as dúvidas sobre custos, prazos e disciplinas.</text><text x="320" y="708" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#65788e">4. Procure a DRI para confirmar as informações.</text><text x="314" y="797" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#30465e">O roteiro não efetua inscrição nem avalia elegibilidade.</text><text x="301" y="859" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#74869a">TELA 08  •  RF04, RF05, RF06  •  wireframe de baixa fidelidade</text></svg>