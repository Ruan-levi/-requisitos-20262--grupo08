</text><text x="316" y="658" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#65788e">✓ Regras de candidatura</text><text x="316" y="688" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#65788e">✓ Idioma / custos / períodos</text><rect x="1003" y="365" width="374" height="316" rx="12" fill="#fff" stroke="#d5dfe9" stroke-width="1"/><text x="1026" y="401" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#30465e">Fontes oficiais</text><rect x="1026" y="428" width="320" height="40" rx="9" fill="#1a589e" stroke="#1a589e" stroke-width="1"/><text x="1042" y="454" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#fff">Documento de referência ↗</text><rect x="1026" y="484" width="320" height="40" rx="9" fill="#eef4fc" stroke="#d1dfec" stroke-width="1"/><text x="1042" y="510" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#27568b">Consultar documentação →</text><rect x="1026" y="540" width="320" height="40" rx="9" fill="#eef4fc" stroke="#d1dfec" stroke-width="1"/><text x="1042" y="566" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#27568b">Falar com a DRI →</text><text x="301" y="859" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#74869a">TELA 06  •  RF05, RF08  •  wireframe de baixa fidelidade</text></svg>