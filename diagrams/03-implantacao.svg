<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1760" height="1080" viewBox="0 0 1760 1080" role="img" aria-label="UML 03 — IMPLANTAÇÃO: Onde o portal funcionaria e como os componentes se comunicariam">
<title>UML 03 — IMPLANTAÇÃO</title><desc>Onde o portal funcionaria e como os componentes se comunicariam. Modelo UML conceitual do Grupo 08, sem implantação existente.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#0B1D34"/><stop offset="1" stop-color="#081122"/></linearGradient>
  <linearGradient id="banner" x1="0" x2="1"><stop offset="0" stop-color="#173D62"/><stop offset=".58" stop-color="#16344D"/><stop offset="1" stop-color="#19294B"/></linearGradient>
  <linearGradient id="cardB" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#173857"/><stop offset="1" stop-color="#112942"/></linearGradient>
  <linearGradient id="cardG" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#194A42"/><stop offset="1" stop-color="#10392F"/></linearGradient>
  <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#53B7FF"/></marker>
  <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#40D7A0"/></marker>
  <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#A6A0FF"/></marker>
</defs>
<rect width="1760" height="1080" fill="url(#bg)"/>
<rect x="0" y="0" width="1760" height="176" fill="url(#banner)"/>
<rect x="65" y="43" width="72" height="72" rx="18" fill="#0A253F" stroke="#65BFFF" stroke-width="2"/>
<text x="101" y="90" font-family="Arial,sans-serif" font-size="30" text-anchor="middle" font-weight="700" fill="#A5E6FF">03</text>
<text x="163" y="62" font-family="Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="2.3" fill="#73D7FF">GRUPO 08  /  PORTAL DE INTERNACIONALIZAÇÃO</text>
<text x="163" y="107" font-family="Arial,sans-serif" font-size="37" font-weight="700" fill="#FFFFFF">UML 03 — IMPLANTAÇÃO</text>
<text x="163" y="143" font-family="Arial,sans-serif" font-size="21" fill="#D1E1F3">Onde o portal funcionaria e como os componentes se comunicariam</text>
<text x="78" y="227" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#FFCF83" font-weight="700" text-anchor="start">CENÁRIO DE HOSPEDAGEM POSSÍVEL — NÃO REPRESENTA UMA IMPLANTAÇÃO REAL</text><rect x="73" y="322" width="335" height="365" rx="22" fill="#11243B" stroke="#53B7FF" stroke-width="2.4" opacity="1"/><path d="M73 343 l18 -21 h315 l-18 21 Z" fill="#1A3453" stroke="#53B7FF" stroke-width="2.2"/><text x="96" y="384" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#53B7FF" font-weight="700" text-anchor="start">DISPOSITIVO</text><text x="96" y="420" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#F7FBFF" font-weight="700" text-anchor="start">Usuário / navegador</text><line x1="97" y1="440" x2="383" y2="440" stroke="#36526D" stroke-width="2" stroke-linecap="round"/><text x="98" y="488" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#B9CBE0" font-weight="400" text-anchor="start">Estudante, docente</text><text x="98" y="524" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#B9CBE0" font-weight="400" text-anchor="start">ou equipe editorial.</text><text x="98" y="560" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#B9CBE0" font-weight="400" text-anchor="start">Acesso via navegador</text><text x="98" y="596" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#B9CBE0" font-weight="400" text-anchor="start">no celular ou PC.</text><rect x="493" y="322" width="350" height="365" rx="22" fill="#11243B" stroke="#53B7FF" stroke-width="2.4" opacity="1"/><path d="M493 343 l18 -21 h330 l-18 21 Z" fill="#1A3453" stroke="#53B7FF" stroke-width="2.2"/><text x="516" y="384" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#53B7FF" font-weight="700" text-anchor="start">HOSPEDAGEM WEB</text><text x="516" y="420" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#F7FBFF" font-weight="700" text-anchor="start">Interface do portal</text><line x1="517" y1="440" x2="818" y2="440" stroke="#36526D" stroke-width="2" stroke-linecap="round"/><text x="518" y="488" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#B9CBE0" font-weight="400" text-anchor="start">Páginas de consulta</text><text x="518" y="524" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#B9CBE0" font-weight="400" text-anchor="start">e painel administrativo.</text><text x="518" y="560" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#B9CBE0" font-weight="400" text-anchor="start">Responsiva e acessível.</text><text x="518" y="596" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#B9CBE0" font-weight="400" text-anchor="start">Sem provedor definido.</text><rect x="926" y="322" width="350" height="365" rx="22" fill="#11243B" stroke="#40D7A0" stroke-width="2.4" opacity="1"/><path d="M926 343 l18 -21 h330 l-18 21 Z" fill="#1A3453" stroke="#40D7A0" stroke-width="2.2"/><text x="949" y="384" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#40D7A0" font-weight="700" text-anchor="start">APLICAÇÃO</text><text x="949" y="420" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#F7FBFF" font-weight="700" text-anchor="start">API e serviços</text><line x1="950" y1="440" x2="1251" y2="440" stroke="#36526D" stroke-width="2" stroke-linecap="round"/><text x="951" y="488" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#B9CBE0" font-weight="400" text-anchor="start">Orientações e pesquisa;</text><text x="951" y="524" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#B9CBE0" font-weight="400" text-anchor="start">edição, revisão e acesso;</text><text x="951" y="560" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#B9CBE0" font-weight="400" text-anchor="start">validação de permissões.</text><text x="951" y="596" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#B9CBE0" font-weight="400" text-anchor="start">Sem provedor definido.</text><rect x="1364" y="322" width="322" height="365" rx="22" fill="#11243B" stroke="#A6A0FF" stroke-width="2.4" opacity="1"/><path d="M1364 343 l18 -21 h302 l-18 21 Z" fill="#1A3453" stroke="#A6A0FF" stroke-width="2.2"/><text x="1387" y="384" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#A6A0FF" font-weight="700" text-anchor="start">DADOS</text><text x="1387" y="420" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#F7FBFF" font-weight="700" text-anchor="start">Armazenamento</text><line x1="1388" y1="440" x2="1661" y2="440" stroke="#36526D" stroke-width="2" stroke-linecap="round"/><text x="1389" y="488" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#B9CBE0" font-weight="400" text-anchor="start">Orientações e fontes;</text><text x="1389" y="524" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#B9CBE0" font-weight="400" text-anchor="start">categorias e perfis;</text><text x="1389" y="560" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#B9CBE0" font-weight="400" text-anchor="start">histórico de revisão.</text><text x="1389" y="596" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#B9CBE0" font-weight="400" text-anchor="start">Acesso restrito.</text><path d="M408 517 H492" fill="none" stroke="#53B7FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowBlue)"  opacity="1"/><path d="M843 517 H925" fill="none" stroke="#53B7FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowBlue)"  opacity="1"/><path d="M1276 517 H1363" fill="none" stroke="#A6A0FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowPurple)"  opacity="1"/><rect x="408" y="454" width="105" height="36" rx="9" fill="#0B243C" stroke="#53B7FF" stroke-width="1.5" opacity="1"/><text x="460.5" y="478" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#53B7FF" font-weight="700" text-anchor="middle">HTTPS</text><rect x="836" y="454" width="105" height="36" rx="9" fill="#0B243C" stroke="#53B7FF" stroke-width="1.5" opacity="1"/><text x="888.5" y="478" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#53B7FF" font-weight="700" text-anchor="middle">HTTPS</text><rect x="1248" y="454" width="162" height="36" rx="9" fill="#0B243C" stroke="#A6A0FF" stroke-width="1.5" opacity="1"/><text x="1329" y="478" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#A6A0FF" font-weight="700" text-anchor="middle">canal seguro</text><rect x="73" y="733" width="1613" height="179" rx="24" fill="#182A40" stroke="#365673" stroke-width="2.4" opacity="1"/><text x="111" y="783" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#F7FBFF" font-weight="700" text-anchor="start">FONTES OFICIAIS  •  fora da infraestrutura do portal</text><text x="111" y="828" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#B9CBE0" font-weight="400" text-anchor="start">Editais, orientações de vistos e canais institucionais continuam nos respectivos sites de origem.</text><text x="111" y="861" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#B9CBE0" font-weight="400" text-anchor="start">O portal apresenta links para consulta — não emite vistos, aprova intercâmbios nem altera históricos.</text><path d="M674 672 V714" fill="none" stroke="#53B7FF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowBlue)" stroke-dasharray="9 8" opacity="1"/><rect x="75" y="935" width="1609" height="63" rx="15" fill="#282941" stroke="#5C6191" stroke-width="1.5" opacity="1"/><text x="108" y="974" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#A6A0FF" font-weight="700" text-anchor="start">SEGURANÇA PREVISTA: HTTPS (RNF03)  ·  PERFIS DE ACESSO (RN11)  ·  PRIVACIDADE (RNF05)</text><rect x="0" y="1015" width="1760" height="65" fill="#08111F"/><path d="M72 1015 H1688" stroke="#2B455F" stroke-width="2"/><text x="72" y="1059" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#B9CBE0" font-weight="400" text-anchor="start">Como explicar: dispositivo → interface → serviços → dados; tudo ainda em especificação.</text><text x="1688" y="1059" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#8FA6BD" font-weight="700" text-anchor="end">MODELO CONCEITUAL • M1 / P1 • 2026.2</text></svg>