<text x="163" y="62" font-family="Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="2.3" fill="#73D7FF">GRUPO 08  /  PORTAL DE INTERNACIONALIZAÇÃO</text>
<text x="163" y="107" font-family="Arial,sans-serif" font-size="37" font-weight="700" fill="#FFFFFF">UML 02 — COMPONENTES</text>
<text x="163" y="143" font-family="Arial,sans-serif" font-size="21" fill="#D1E1F3">Como a interface se conecta aos serviços, dados e fontes oficiais</text>
<rect x="67" y="206" width="794" height="635" rx="23" fill="#102438" stroke="#325A76" stroke-width="2.3" opacity="1"/><rect x="897" y="206" width="795" height="635" rx="23" fill="#132C2E" stroke="#2A715A" stroke-width="2.3" opacity="1"/><rect x="94" y="237" width="38" height="36" rx="10" fill="#53B7FF" stroke="#53B7FF" stroke-width="0" opacity="1"/><text x="113" y="264" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#091426" font-weight="700" text-anchor="middle">1</text><text x="149" y="265" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#F7FBFF" font-weight="700" text-anchor="start">EXPERIÊNCIA DE CONSULTA</text><rect x="923" y="237" width="38" height="36" rx="10" fill="#40D7A0" stroke="#40D7A0" stroke-width="0" opacity="1"/><text x="942" y="264" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#091426" font-weight="700" text-anchor="middle">2</text><text x="978" y="265" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#F7FBFF" font-weight="700" text-anchor="start">GESTÃO EDITORIAL</text><rect x="114" y="302" width="700" height="114" rx="18" fill="url(#cardB)" stroke="#53B7FF" stroke-width="2.4" opacity="1"/><rect x="134" y="328" width="30" height="28" rx="3" fill="none" stroke="#53B7FF" stroke-width="2.5"/><rect x="127" y="333" width="10" height="7" fill="#53B7FF"/><rect x="127" y="345" width="10" height="7" fill="#53B7FF"/><text x="177" y="352" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#F7FBFF" font-weight="700" text-anchor="start">Portal público</text><text x="137" y="386" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#B9CBE0" font-weight="400" text-anchor="start">Catálogo, busca, filtros, fontes,</text><text x="137" y="408" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#B9CBE0" font-weight="400" text-anchor="start">contatos e idiomas disponíveis</text><text x="795" y="398" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#53B7FF" font-weight="700" text-anchor="end">RF01–RF08</text><rect x="940" y="302" width="705" height="114" rx="18" fill="url(#cardG)" stroke="#40D7A0" stroke-width="2.4" opacity="1"/><rect x="960" y="328" width="30" height="28" rx="3" fill="none" stroke="#40D7A0" stroke-width="2.5"/><rect x="953" y="333" width="10" height="7" fill="#40D7A0"/><rect x="953" y="345" width="10" height="7" fill="#40D7A0"/><text x="1003" y="352" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#F7FBFF" font-weight="700" text-anchor="start">Painel administrativo</text><text x="963" y="386" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#B9CBE0" font-weight="400" text-anchor="start">Acesso autorizado para editar, revisar</text><text x="963" y="408" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#B9CBE0" font-weight="400" text-anchor="start">e administrar permissões</text><text x="1626" y="398" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#40D7A0" font-weight="700" text-anchor="end">RF09–RF12 · RF14</text><path d="M310 417 V476" fill="none" stroke="#53B7FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowBlue)"  opacity="1"/><path d="M638 417 V476" fill="none" stroke="#53B7FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowBlue)"  opacity="1"/><path d="M1130 417 V476" fill="none" stroke="#40D7A0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowGreen)"  opacity="1"/><path d="M1470 417 V476" fill="none" stroke="#40D7A0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowGreen)"  opacity="1"/><rect x="114" y="478" width="340" height="224" rx="18" fill="url(#cardB)" stroke="#53B7FF" stroke-width="2.4" opacity="1"/><rect x="134" y="504" width="30" height="28" rx="3" fill="none" stroke="#53B7FF" stroke-width="2.5"/><rect x="127" y="509" width="10" height="7" fill="#53B7FF"/><rect x="127" y="521" width="10" height="7" fill="#53B7FF"/><text x="177" y="528" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#F7FBFF" font-weight="700" text-anchor="start">API de orientações</text><text x="137" y="562" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#B9CBE0" font-weight="400" text-anchor="start">Lista e entrega apenas</text><text x="137" y="584" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#B9CBE0" font-weight="400" text-anchor="start">conteúdos publicados;</text><text x="137" y="606" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#B9CBE0" font-weight="400" text-anchor="start">mostra fontes e revisão.</text><text x="435" y="684" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#53B7FF" font-weight="700" text-anchor="end">RF04–RF08</text><rect x="477" y="478" width="337" height="224" rx="18" fill="url(#cardB)" stroke="#53B7FF" stroke-width="2.4" opacity="1"/><rect x="497" y="504" width="30" height="28" rx="3" fill="none" stroke="#53B7FF" stroke-width="2.5"/><rect x="490" y="509" width="10" height="7" fill="#53B7FF"/><rect x="490" y="521" width="10" height="7" fill="#53B7FF"/><text x="540" y="528" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#F7FBFF" font-weight="700" text-anchor="start">Pesquisa e filtros</text><text x="500" y="562" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#B9CBE0" font-weight="400" text-anchor="start">Localiza por termo, tema</text><text x="500" y="584" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#B9CBE0" font-weight="400" text-anchor="start">e público-alvo; não</text><text x="500" y="606" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#B9CBE0" font-weight="400" text-anchor="start">exibe rascunhos.</text><text x="795" y="684" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#53B7FF" font-weight="700" text-anchor="end">RF02–RF03</text><rect x="940" y="478" width="337" height="224" rx="18" fill="url(#cardG)" stroke="#40D7A0" stroke-width="2.4" opacity="1"/><rect x="960" y="504" width="30" height="28" rx="3" fill="none" stroke="#40D7A0" stroke-width="2.5"/><rect x="953" y="509" width="10" height="7" fill="#40D7A0"/><rect x="953" y="521" width="10" height="7" fill="#40D7A0"/><text x="1003" y="528" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#F7FBFF" font-weight="700" text-anchor="start">Fluxo editorial</text><text x="963" y="562" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#B9CBE0" font-weight="400" text-anchor="start">Criar → rascunho → revisão</text><text x="963" y="584" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#B9CBE0" font-weight="400" text-anchor="start">→ publicar; guarda histórico</text><text x="963" y="606" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#B9CBE0" font-weight="400" text-anchor="start">e responsável.</text><text x="1258" y="684" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#40D7A0" font-weight="700" text-anchor="end">RF10–RF12</text><rect x="1300" y="478" width="345" height="224" rx="18" fill="url(#cardG)" stroke="#40D7A0" stroke-width="2.4" opacity="1"/><rect x="1320" y="504" width="30" height="28" rx="3" fill="none" stroke="#40D7A0" stroke-width="2.5"/><rect x="1313" y="509" width="10" height="7" fill="#40D7A0"/><rect x="1313" y="521" width="10" height="7" fill="#40D7A0"/><text x="1363" y="528" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#F7FBFF" font-weight="700" text-anchor="start">Controle de acesso</text><text x="1323" y="562" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#B9CBE0" font-weight="400" text-anchor="start">Autenticação e perfis:</text><text x="1323" y="584" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#B9CBE0" font-weight="400" text-anchor="start">editor, publicador e</text><text x="1323" y="606" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#B9CBE0" font-weight="400" text-anchor="start">administrador.</text><text x="1626" y="684" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#40D7A0" font-weight="700" text-anchor="end">RF09 · RF14</text><rect x="300" y="876" width="680" height="152" rx="22" fill="#28294F" stroke="#A6A0FF" stroke-width="2.4" opacity="1"/><ellipse cx="350" cy="934" rx="21" ry="8" fill="none" stroke="#A6A0FF" stroke-width="3"/><path d="M329 934 V976 C329 988 371 988 371 976 V934 M329 953 C329 965 371 965 371 953" fill="none" stroke="#A6A0FF" stroke-width="3"/><text x="399" y="923" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#F7FBFF" font-weight="700" text-anchor="start">BANCO DE DADOS (PROPOSTO)</text><text x="399" y="964" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#B9CBE0" font-weight="400" text-anchor="start">Orientações, categorias, identidades,</text><text x="399" y="991" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#B9CBE0" font-weight="400" text-anchor="start">perfis e revisões editoriais.</text><rect x="1065" y="876" width="608" height="152" rx="22" fill="#292B42" stroke="#A6A0FF" stroke-width="2.3" opacity="1"/><text x="1101" y="922" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#F7FBFF" font-weight="700" text-anchor="start">FONTES INSTITUCIONAIS EXTERNAS</text><text x="1101" y="962" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#B9CBE0" font-weight="400" text-anchor="start">Editais, documentos e canais oficiais.</text><text x="1101" y="988" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#B9CBE0" font-weight="400" text-anchor="start">O portal apresenta links, sem integração automática.</text><path d="M280 702 V828 H420 V875" fill="none" stroke="#53B7FF" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowBlue)"  opacity="1"/><path d="M644 702 V842 H700 V875" fill="none" stroke="#53B7FF" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowBlue)"  opacity="1"/><path d="M1100 702 V818 H855 V875" fill="none" stroke="#40D7A0" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowGreen)"  opacity="1"/><path d="M1470 702 V828 H940 V875" fill="none" stroke="#40D7A0" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowGreen)"  opacity="1"/><rect x="1016" y="832" width="250" height="36" rx="9" fill="#0B243C" stroke="#A6A0FF" stroke-width="1.5" opacity="1"/><text x="1141" y="856" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#A6A0FF" font-weight="700" text-anchor="middle">referências por link</text><rect x="0" y="1060" width="1760" height="80" fill="#08111F"/><path d="M72 1060 H1688" stroke="#2B455F" stroke-width="2"/><text x="72" y="1104" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#B9CBE0" font-weight="400" text-anchor="start">Como explicar: interface → serviços → banco; links externos oferecem a origem oficial.</text><text x="1688" y="1104" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#8FA6BD" font-weight="700" text-anchor="end">MODELO CONCEITUAL • M1 / P1 • 2026.2</text></svg>